name: bridge-smoke

on:
  pull_request:
    paths:
      - "web/**"
      - "internal/config/**"
      - "tools/extension-screenshot/**"
      - "scripts/bridge_e2e.ps1"
      - ".github/workflows/bridge-smoke.yml"
  push:
    branches: [ "main", "master" ]
    paths:
      - "web/**"
      - "internal/config/**"
      - "tools/extension-screenshot/**"
      - "scripts/bridge_e2e.ps1"
      - ".github/workflows/bridge-smoke.yml"

# This workflow runs quick bridge-focused tests.
# Full CI (build + test + lint + security) is handled by ci.yml.

jobs:
  bridge-handler-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run bridge-focused tests
        run: go test -race -v ./web -run Bridge -count=1

  extension-script-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Syntax check extension scripts
        run: |
          for f in tools/extension-screenshot/src/*.js; do
            echo "Checking $f ..."
            node --check "$f"
          done

      - name: Install extension test dependencies
        working-directory: tools/extension-screenshot
        run: npm ci --include=dev --ignore-scripts --no-audit --no-fund

      - name: Run extension regression tests
        working-directory: tools/extension-screenshot
        shell: bash
        run: |
          set -o pipefail
          node --test --test-reporter=tap test/*.test.mjs | tee extension-tests.log

      - name: Preserve extension test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extension-regression-${{ github.workflow }}
          path: tools/extension-screenshot/extension-tests.log
          if-no-files-found: error
          retention-days: 7
