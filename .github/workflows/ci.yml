name: ci

on:
  pull_request:
    branches: [ "main", "master" ]
  push:
    branches: [ "main", "master" ]

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CGO_ENABLED: 1

jobs:
  # --- Build ---
  build:
    name: Build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build -v ./...

      - name: Build cmd binaries
        run: |
          go build -v ./cmd/unimap-web
          go build -v ./cmd/unimap-cli

  # --- Test ---
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests (with race detector)
        env:
          CGO_ENABLED: 1
        run: go test -race -v -count=1 ./...

      - name: Run tests (coverage)
        env:
          CGO_ENABLED: 1
        run: go test -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}
          path: coverage.out
          retention-days: 7

  # --- Lint ---
  lint:
    name: Lint
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run go vet
        run: go vet ./...

      - name: Run gofmt check
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          # install-mode=goinstall 使用项目工具链（go1.26，由 go-version-file 指定）
          # 从源码构建 golangci-lint，避免预编译二进制（用 go1.24 构建）无法分析
          # go1.26 目标代码："the Go language version (go1.24) used to build
          # golangci-lint is lower than the targeted Go version (1.26)"。
          # 锁定 v1.64.8 以保持现有 v1 版 .golangci.yml 配置兼容。
          install-mode: goinstall
          version: v1.64.8
          args: --timeout=5m

  # --- Extension scripts ---
  extension-scripts:
    name: Extension Script Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Syntax check extension scripts
        run: |
          for f in tools/extension-screenshot/src/*.js; do
            echo "Checking $f ..."
            node --check "$f"
          done

  # --- Real headless browser smoke test (no DISPLAY/Xvfb) ---
  headless-browser:
    name: Headless Browser E2E
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Locate preinstalled Chrome
        run: |
          chrome_path="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$chrome_path"
          echo "UNIMAP_CHROME_PATH=$chrome_path" >> "$GITHUB_ENV"

      - name: Capture and collect without a display server
        env:
          DISPLAY: ""
          UNIMAP_CHROME_USER_DATA_DIR: ${{ runner.temp }}/unimap-chrome-profile
        run: |
          go test -tags=headless_e2e -count=1 -run TestHeadlessChromeExecutesJavaScriptAndCapturesPNG ./internal/screenshot
          go test -tags=headless_e2e -count=1 -run 'TestRelaxed_|TestStrict_MD5Change|TestNormalDynamic' ./internal/tamper

  # --- Security ---
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run govulncheck
        env:
          GOTOOLCHAIN: go1.26.6
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  # --- Docker Build & Push ---
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [test, lint, security, headless-browser, extension-scripts]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}

      - name: Build and push
        id: image-build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            CGO_ENABLED=1
            UNIMAP_VERSION=${{ github.ref_name }}
            UNIMAP_GIT_COMMIT=${{ github.sha }}
            UNIMAP_BUILD_TIME=${{ github.event.head_commit.timestamp }}

      - name: Test image verifier
        run: python3 -m unittest discover -s scripts -p 'test_ci_image_smoke.py' -v

      - name: Verify image
        timeout-minutes: 7
        env:
          IMAGE_REPOSITORY: ${{ github.repository }}
          IMAGE_DIGEST: ${{ steps.image-build.outputs.digest }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          python3 scripts/ci_image_smoke.py "ghcr.io/${IMAGE_REPOSITORY,,}@${IMAGE_DIGEST}" "$EXPECTED_COMMIT"
